name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Artifacts & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Configure Keystore & Signing Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            cat <<EOF > release.properties
storeFile=release.keystore
storePassword=$KEYSTORE_PASSWORD
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
EOF
            echo "Release keystore and signing properties successfully configured."
          else
            echo "::error::KEYSTORE_BASE64 secret is not defined in repository secrets."
            exit 1
          fi

      - name: Build Signed APK and AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Package Release Assets & Generate Checksums
        run: |
          mkdir -p release_dist
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release_dist/ \;
          find app/build/outputs/bundle/release/ -name "*.aab" -exec cp {} release_dist/ \;
          cd release_dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_dist/*.apk
            release_dist/*.aab
            release_dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive Release Artifacts (Workflow Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: veltpulse-release-dist
          path: release_dist/
          retention-days: 30
