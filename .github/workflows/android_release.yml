name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Application APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Asset
        run: |
          mkdir -p release_dist
          cp app/build/outputs/apk/debug/app-debug.apk release_dist/VeltPulse-v1.0.0.apk
          cd release_dist && sha256sum VeltPulse-v1.0.0.apk > SHA256SUMS.txt

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: |
            release_dist/VeltPulse-v1.0.0.apk
            release_dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
